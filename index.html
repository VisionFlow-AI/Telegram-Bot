    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;

        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);

            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }

        }
        h1 { margin: 0 0 20px 0; font-size: 24px; }
        p { margin: 10px 0; opacity: 0.9; }

    <script>
        // Получаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        
        // ⚠️ ВАЖНО: yclid - это правильное название параметра от Яндекс.Директ!
        const yclid = urlParams.get('yclid');
        const utm_source = urlParams.get('utm_source') || 'yandex';
        const utm_medium = urlParams.get('utm_medium') || 'cpc';
        const utm_campaign = urlParams.get('utm_campaign') || 'direct';
        const utm_term = urlParams.get('utm_term') || '';
        const utm_content = urlParams.get('utm_content') || '';
        
        // Логируем для отладки
        console.log('Параметры:', {yclid, utm_source, utm_medium, utm_campaign});
        console.log('URL:', window.location.href);
        console.log('ym функция доступна:', typeof ym !== 'undefined');
        
        // Получаем ClientID из Метрики (это КЛЮЧЕВОЙ момент!)
        let clientId = null;
        
        // Ждем инициализации Метрики и получаем ClientID
        if (typeof ym !== 'undefined') {
            console.log('Метрика доступна, получаем ClientID...');
            ym(104830688, 'getClientID', function(retrievedClientID) { // ОБНОВЛЕН ID СЧЕТЧИКА
                clientId = retrievedClientID;
                console.log('ClientID от Метрики:', clientId);
                
                // Формируем start параметр для бота БЕЗ utm_ префикса
                // Формат: source_medium_campaign_cid_CLIENTID_yclid_YCLID
                let startParam = `${utm_source}_${utm_medium}_${utm_campaign}`;
                
                // Добавляем term и content если есть
                if (utm_term) startParam += `_${utm_term}`;
                if (utm_content) startParam += `_${utm_content}`;
                
                // ⚠️ ВАЖНО: Передаем ClientID от Метрики
                if (clientId) {
                    startParam += `_cid_${clientId}`;
                }
                
                // Если есть yclid, тоже передаем для аналитики
                if (yclid) {
                    startParam += `_yclid_${yclid}`;
                }
                
                // Формируем ссылку на бот
                const botLink = `https://t.me/vision_flow_bot?start=${startParam}`;
                
                console.log('Финальная ссылка:', botLink);
                
                // Редирект
                window.location.href = botLink;
            });
        }
        
        // Fallback на случай, если ClientID не получен за 1 секунду
        setTimeout(() => {
            if (!clientId) {
                console.warn('ClientID не получен, используем fallback');
                console.log('Fallback: clientId =', clientId);
                let startParam = `${utm_source}_${utm_medium}_${utm_campaign}`;
                if (utm_term) startParam += `_${utm_term}`;
                if (utm_content) startParam += `_${utm_content}`;
                // ⚠️ ВАЖНО: В fallback НЕ добавляем _cid_ и _yclid_, так как ClientID не получен
                // Это будет старая кампания без атрибуции
                
                console.log('Fallback ссылка:', `https://t.me/vision_flow_bot?start=${startParam}`);
                window.location.href = `https://t.me/vision_flow_bot?start=${startParam}`;
            }
        }, 1000);
    </script>
